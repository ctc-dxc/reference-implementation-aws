# Ref: https://github.com/backstage/charts/tree/main/charts/backstage
ingress:
  enabled: true
  className: "nginx"
  extraHosts: []
  path: "/"
  tls:
    enabled: true
    secretName: "backstage-server-tls"
backstage:
  replicas: 1
  # ctc-dxc: カスタマイズ用に自前ビルドしたイメージへ切り替える。
  # ソースは ctc-dxc/codespire-backstage（cnoe-io/backstage-app のミラー・private）。
  # tag はソースの commit SHA を使う（可変タグを使わない＝immutable タグ規約）。
  # ECR は CMK 暗号化・タグ IMMUTABLE。node role に kms:Decrypt（ViaService=ecr）を付与済み。
  #
  # 【版差の注意】このイメージは backstage.json v1.49.4 で、旧 ghcr イメージ
  # （2024-10 ビルド・base ~v1.28）から 21 マイナー分の飛躍がある。DB migration は revert 不可のため、
  # kind に dev のスキーマ＋knex_migrations を復元して事前検証した
  # （catalog 30→38・auth 7→12 が適用され error なし・pod Ready）。
  # 未検証: 実 Keycloak ログイン・実 GitHub App 経由の scaffolder・ECR からの実 pull（CMK 復号）。
  image:
    registry: 319391036962.dkr.ecr.ap-northeast-1.amazonaws.com
    repository: dev-plat-codespire-backstage
    tag: 75e22bb
    pullPolicy: IfNotPresent
  command: ["node", "packages/backend"]
  extraEnvVarsSecrets:
    - backstage-env-vars
  extraVolumeMounts:
    - name: backstage-config
      mountPath: "/app/config"
      readOnly: true
  extraVolumes:
    - name: backstage-config
      projected:
        sources:
          - secret:
              name: integrations
              items:
                - key: github-integration.yaml
                  path: github-integration.yaml
          - secret:
              name: k8s-config
              items:
                - key: k8s-config.yaml
                  path: k8s-config.yaml
  appConfig:
    app:
      title: CNOE Backstage
      baseUrl: ${BACKSTAGE_FRONTEND_URL}
    organization:
      name: CNOE
    backend:
      baseUrl: ${BACKSTAGE_FRONTEND_URL}
      csp:
        connect-src: ['self', 'http:', 'https:']
      cors:
        origin: ${BACKSTAGE_FRONTEND_URL}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
      cache:
        store: memory
    integrations:
      github:
        - host: github.com
          apps:
            - $include: /app/config/github-integration.yaml
    proxy:
      '/argo-workflows/api':
        target: ${ARGO_WORKFLOWS_URL}
        changeOrigin: true
        secure: true
        headers:
          Authorization:
            $env: ARGO_WORKFLOWS_AUTH_TOKEN
      '/argocd/api':
        target: ${ARGO_CD_URL}
        changeOrigin: true
        headers:
          Cookie:
            $env: ARGOCD_AUTH_TOKEN
    techdocs:
      builder: 'local'
      generator:
        runIn: 'docker'
      publisher:
        type: 'local'
    auth:
      environment: development
      session:
        secret: "MW2sV-sIPngEl26vAzatV-6VqfsgAx4bPIz7PuE_2Lk="
      providers:
        keycloak-oidc:
          development:
            metadataUrl: ${KEYCLOAK_NAME_METADATA}
            clientId: backstage
            clientSecret: ${BACKSTAGE_CLIENT_SECRET}
            additionalScopes: 'openid profile email groups'
            prompt: auto
    scaffolder:
    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Template]
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - $include: /app/config/k8s-config.yaml
    argocd:
      username: admin
      password: ${ARGOCD_ADMIN_PASSWORD}
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: in-cluster
              url: ${ARGO_CD_URL}
              username: admin
              password: ${ARGOCD_ADMIN_PASSWORD}
    argoWorkflows:
      baseUrl: ${ARGO_WORKFLOWS_URL}
# Bitnami が 2025-08 に docker.io/bitnami/* の公開配布を終了したため、backstage chart の
# postgresql サブチャートが pin するイメージも 404 になる（keycloak と同根・実測）。
# global は親 values の top-level に置く必要がある（サブチャートへ継承されるため）。
global:
  security:
    allowInsecureImages: true

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: "backstage"
    existingSecret: "backstage-env-vars"
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD
  architecture: standalone
serviceAccount:
  create: true