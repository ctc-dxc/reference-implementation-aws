# Ref: https://github.com/backstage/charts/tree/main/charts/backstage
ingress:
  enabled: true
  className: "nginx"
  extraHosts: []
  path: "/"
  tls:
    enabled: true
    secretName: "backstage-server-tls"
backstage:
  replicas: 1
  # ctc-dxc: カスタマイズ検証（2026-09-02）の前に稼働していた本体バージョンへ戻す。
  # backstage.json 1.28.4（fork の commit 135c0cb2 相当）。
  #
  # 【このイメージの出所】上流 ghcr.io/cnoe-io/backstage-app:135c0cb2... を
  # そのまま ECR へ再登録したもので、**自前ビルドではない**。
  # digest は上流と同一（sha256:f96950b9eae5...）＝稼働していた成果物とバイト単位で同じ。
  #
  # 自前ビルドにしなかった理由: **commit 135c0cb2 は現在ビルドできない**。
  # 当該コミットの yarn.lock に ts-json-schema-generator のエントリが無く、今日 yarn が
  # 新しく解決すると 2.9.0（node>=22 が必要）になるが、同コミットの Dockerfile は node 18 を
  # 固定しているため install が engines チェックで失敗する（2026-09-02 実測）。
  # node を 22 へ上げる等の改変でビルドは通る可能性があるが、それは「稼働していたものと
  # 同じイメージ」ではなくなるため、復旧目的では上流成果物の再登録を選んだ。
  # ＝**git commit を固定してもビルドの再現性は保証されない**（方針文書 §5-3 に記録）。
  #
  # tag に -upstream を付けているのは出所を明示するため（他の tag は fork の commit SHA で
  # 自前ビルド）。ECR は CMK 暗号化・タグ IMMUTABLE。
  #
  # 本体の版上げは別途判断する（1.54.6 への bump は backend のビルドが通らない。
  # 詳細は docs/codespire-backstage-customization-policy.md §5-3）。
  image:
    registry: 319391036962.dkr.ecr.ap-northeast-1.amazonaws.com
    repository: dev-plat-codespire-backstage
    tag: 135c0cb-upstream
    pullPolicy: IfNotPresent
  command: ["node", "packages/backend"]
  extraEnvVarsSecrets:
    - backstage-env-vars
  extraVolumeMounts:
    - name: backstage-config
      mountPath: "/app/config"
      readOnly: true
  extraVolumes:
    - name: backstage-config
      projected:
        sources:
          - secret:
              name: integrations
              items:
                - key: github-integration.yaml
                  path: github-integration.yaml
          - secret:
              name: k8s-config
              items:
                - key: k8s-config.yaml
                  path: k8s-config.yaml
  appConfig:
    app:
      title: CNOE Backstage
      baseUrl: ${BACKSTAGE_FRONTEND_URL}
    organization:
      name: CNOE
    backend:
      baseUrl: ${BACKSTAGE_FRONTEND_URL}
      csp:
        connect-src: ['self', 'http:', 'https:']
      cors:
        origin: ${BACKSTAGE_FRONTEND_URL}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
      cache:
        store: memory
    integrations:
      github:
        - host: github.com
          apps:
            - $include: /app/config/github-integration.yaml
    proxy:
      '/argo-workflows/api':
        target: ${ARGO_WORKFLOWS_URL}
        changeOrigin: true
        secure: true
        headers:
          Authorization:
            $env: ARGO_WORKFLOWS_AUTH_TOKEN
      '/argocd/api':
        target: ${ARGO_CD_URL}
        changeOrigin: true
        headers:
          Cookie:
            $env: ARGOCD_AUTH_TOKEN
    techdocs:
      builder: 'local'
      generator:
        runIn: 'docker'
      publisher:
        type: 'local'
    auth:
      environment: development
      session:
        secret: "MW2sV-sIPngEl26vAzatV-6VqfsgAx4bPIz7PuE_2Lk="
      providers:
        keycloak-oidc:
          development:
            metadataUrl: ${KEYCLOAK_NAME_METADATA}
            clientId: backstage
            clientSecret: ${BACKSTAGE_CLIENT_SECRET}
            additionalScopes: 'openid profile email groups'
            prompt: auto
    scaffolder:
    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Template]
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - $include: /app/config/k8s-config.yaml
    argocd:
      username: admin
      password: ${ARGOCD_ADMIN_PASSWORD}
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: in-cluster
              url: ${ARGO_CD_URL}
              username: admin
              password: ${ARGOCD_ADMIN_PASSWORD}
    argoWorkflows:
      baseUrl: ${ARGO_WORKFLOWS_URL}
# Bitnami が 2025-08 に docker.io/bitnami/* の公開配布を終了したため、backstage chart の
# postgresql サブチャートが pin するイメージも 404 になる（keycloak と同根・実測）。
# global は親 values の top-level に置く必要がある（サブチャートへ継承されるため）。
global:
  security:
    allowInsecureImages: true

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: "backstage"
    existingSecret: "backstage-env-vars"
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD
  architecture: standalone
serviceAccount:
  create: true