adminRealm: "cnoe"
production: true
usePasswordFiles: false
# ctc-dxc: upstream は "forwarded"（RFC 7239 の Forwarded ヘッダ）だったが、
# 前段の ingress-nginx が送るのは X-Forwarded-* であって Forwarded ヘッダではない。
# その結果 Keycloak は「非 HTTPS の接続」と判断し、HTTPS 経由でも Cookie に Secure が付かない
# （実測 2026-08-20: AUTH_SESSION_ID / KC_RESTART に Secure なし・ログに
#  "Non-secure context detected; cookies are not secured" が継続出力）。
# xforwarded にすると X-Forwarded-Proto: https を信頼して Secure が付く。
proxyHeaders: "xforwarded"

global:
  defaultStorageClass: gp3

auth:
  adminUser: cnoe-admin
  adminPassword: cnoe-admin
  existingSecret: keycloak-config
  passwordSecretKey: KEYCLOAK_ADMIN_PASSWORD

ingress:
  enabled: true
  ingressClassName: nginx
  hostnameStrict: true
  servicePort: http
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  tls: false

postgresql:
  enabled: true
  auth:
    username: keycloak
    database: keycloak
    existingSecret: "keycloak-config"
    secretKeys:
      userPasswordKey: POSTGRES_PASSWORD
  architecture: standalone
