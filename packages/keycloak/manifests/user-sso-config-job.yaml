apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-config
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-config
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-config
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: keycloak-config
    namespace: keycloak
roleRef:
  kind: Role
  name: keycloak-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-config
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-config
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: keycloak-config
    namespace: keycloak
roleRef:
  kind: Role
  name: keycloak-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config-job
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "40"
data:
  client-scope-groups-payload.json: |
    {
        "name": "groups",
        "description": "groups a user belongs to",
        "attributes": {
            "consent.screen.text": "Access to groups a user belongs to.",
            "display.on.consent.screen": "true",
            "include.in.token.scope": "true",
            "gui.order": ""
        },
        "type": "default",
        "protocol": "openid-connect"
    }
  group-admin-payload.json: |
    {"name":"admin"}
  group-base-user-payload.json: |
    {"name":"base-user"}
  group-mapper-payload.json: |
    {
        "protocol": "openid-connect",
        "protocolMapper": "oidc-group-membership-mapper",
        "name": "groups",
        "config": {
          "claim.name": "groups",
          "full.path": "false",
          "id.token.claim": "true",
          "access.token.claim": "true",
          "userinfo.token.claim": "true"
        }
    }
  user1-payload.json: |
    {
        "username": "user1",
        "email": "",
        "firstName": "user",
        "lastName": "one",
        "requiredActions": [],
        "emailVerified": false,
        "groups": [
          "/admin"
        ],
        "enabled": true,
        "credentials":
        [
          {
            "type": "password",
            "value": "${USER1_PASSWORD}",
            "temporary": false
          }
        ]
    }
  user2-payload.json: |
    {
        "username": "user2",
        "email": "",
        "firstName": "user",
        "lastName": "two",
        "requiredActions": [],
        "emailVerified": false,
        "groups": [
          "/base-user"
        ],
        "enabled": true,
        "credentials":  [
          {
            "type": "password",
            "value": "${USER1_PASSWORD}",
            "temporary": false
          }
        ]
    }
  argocd-client-payload.json: |
    {
      "protocol": "openid-connect",
      "clientId": "argocd",
      "name": "ArgoCD Client",
      "description": "Used for ArgoCD SSO",
      "publicClient": true,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "attributes": {
        "saml_idp_initiated_sso_url_name": "",
        "oauth2.device.authorization.grant.enabled": false,
        "oidc.ciba.grant.enabled": false
      },
      "alwaysDisplayInConsole": false,
      "rootUrl": "https://${ARGO_CD_URL}",
      "baseUrl": "/applications",
      "redirectUris": [
        "https://${ARGO_CD_URL}/auth/callback",
        "https://${ARGO_CD_URL}/pkce/verify",
        "http://localhost:8085/auth/callback"
      ],
      "adminUrl": "https://${ARGO_CD_URL}",
      "webOrigins": [
        "https://${ARGO_CD_URL}"
      ]
    }
  backstage-client-payload.json: |
    {
      "protocol": "openid-connect",
      "clientId": "backstage",
      "name": "Backstage Client",
      "description": "Used for Backstage SSO",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "attributes": {
        "saml_idp_initiated_sso_url_name": "",
        "oauth2.device.authorization.grant.enabled": false,
        "oidc.ciba.grant.enabled": false
      },
      "alwaysDisplayInConsole": false,
      "rootUrl": "",
      "baseUrl": "",
      "redirectUris": [
        "https://${BACKSTAGE_URL}/api/auth/keycloak-oidc/handler/frame"
      ],
      "webOrigins": [
        "https://${BACKSTAGE_URL}"
      ]
    }
  argo-client-payload.json: |
    {
      "protocol": "openid-connect",
      "clientId": "argo-workflows",
      "name": "Argo Workflows Client",
      "description": "Used for Argo Workflows SSO",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "attributes": {
        "saml_idp_initiated_sso_url_name": "",
        "oauth2.device.authorization.grant.enabled": false,
        "oidc.ciba.grant.enabled": false
      },
      "alwaysDisplayInConsole": false,
      "rootUrl": "",
      "baseUrl": "",
      "redirectUris": [
        "https://${ARGO_WORKFLOW_URL}/oauth2/callback"
      ],
      "webOrigins": [
        "https://${ARGO_WORKFLOW_URL}"
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    # ctc-dxc: **Sync hook にはしない。** Job は spec が immutable なので一度完了すると
    # 二度と走らず、payload の変更（:443 → :8443 等）が realm に届かない。そこで
    # `argocd.argoproj.io/hook: Sync` + `BeforeHookCreation` で毎 sync 再実行させたく
    # なるが、**この環境では job が認証で必ず落ちる**（Secret の
    # KEYCLOAK_ADMIN_PASSWORD が Keycloak 実体のパスワードと乖離している。
    # 経緯は docs/codespire-idp-access-guide.md「SSO 設定 Job は再実行すると失敗する」）。
    # hook にすると失敗が毎 sync の失敗になるため、意図して plain な Job に留める。
    #
    # 【結果として残る制約】既存 client の URL 変更は **job 経由では反映されない**。
    # 反映には管理者が実パスワードで一度だけ admin API を叩く必要がある
    # （手順は docs/codespire-eks-dev-operations.md の「realm の redirect URI を手で揃える」）。
    # 恒久的には Keycloak 側のパスワードを Secret の値へ戻し、Git を正に復帰させる。
spec:
  template:
    metadata:
      generateName: keycloak-config
    spec:
      serviceAccountName: keycloak-config
      restartPolicy: Never
      volumes:
        - name: config-payloads
          configMap:
            name: keycloak-config-job
      containers:
        - name: keycloak-config
          # ubuntu:22.04 から alpine へ変更（実行時 apt install が port 80 を要求するため）。
          # 当環境のノード SG は egress を 443 / 8443 に限定しており archive.ubuntu.com:80 へ
          # 到達できない。ubuntu:22.04 は ca-certificates を含まないため apt を HTTPS に
          # 切り替える回避も成立しない（イメージ層を実測して確認）。
          # alpine は ca-certificates を含み /etc/apk/repositories が既定で https なので
          # 443 のみで apk が動く。egress の緩和は行わない。
          image: docker.io/library/alpine:3.20
          volumeMounts:
            - name: config-payloads
              readOnly: true
              mountPath: "/var/config/"
          envFrom:
            - secretRef:
                name: keycloak-config
          command: ["/bin/sh", "-c"]
          args:
            - |
              #! /bin/sh
              set -ex -o pipefail
              apk add --no-cache curl jq gettext
              
              # Define helper functions
              keycloak_post() {
                local endpoint=$1
                local payload=$2
                local resource_name=$3

                envsubst < ${payload} > /tmp/payload-env.json
                
                HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/response.txt -H "Content-Type: application/json" \
                  -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                  -X POST --data @/tmp/payload-env.json \
                  ${KEYCLOAK_URL}${endpoint})
                
                if [ "$HTTP_STATUS" -eq 409 ]; then
                  echo "${resource_name} already exists, continuing..."
                elif [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 200 ]; then
                  echo "Error creating ${resource_name}: HTTP status $HTTP_STATUS"
                  cat /tmp/response.txt
                fi
              }
              
              keycloak_put() {
                local endpoint=$1
                local resource_name=$2
                
                HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/response.txt -H "Content-Type: application/json" \
                  -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                  -X PUT ${KEYCLOAK_URL}${endpoint})
                
                if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
                  echo "Error updating ${resource_name}: HTTP status $HTTP_STATUS"
                  cat /tmp/response.txt
                fi
              }
              
              keycloak_get() {
                local endpoint=$1
                local jq_filter=$2
                
                curl -sS -H "Content-Type: application/json" \
                  -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                  -X GET ${KEYCLOAK_URL}${endpoint} | jq -e -r "${jq_filter}"
              }
              
              # Get Keycloak token for initial Admin user
              # ADMIN_PASSWORD=$(cat /var/secrets/KEYCLOAK_ADMIN_PASSWORD)
              # USER1_PASSWORD=$(cat /var/secrets/USER1_PASSWORD)
              HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/response.txt -X POST -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "username=cnoe-admin" \
                --data-urlencode "password=${KEYCLOAK_ADMIN_PASSWORD}" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=admin-cli" \
                ${KEYCLOAK_URL}/realms/cnoe/protocol/openid-connect/token)
              if [ "$HTTP_STATUS" -ne 200 ]; then
                echo "Error getting Keycloak token: HTTP status $HTTP_STATUS"
                cat /tmp/response.txt
                exit 1
              fi
              KEYCLOAK_TOKEN=$(cat /tmp/response.txt | jq -e -r '.access_token')
              
              HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/response.txt -H "Authorization: bearer ${KEYCLOAK_TOKEN}" "${KEYCLOAK_URL}/admin/realms/cnoe")
              if [ "$HTTP_STATUS" -ne 200 ]; then
                echo "Error validating Keycloak token: HTTP status $HTTP_STATUS"
                cat /tmp/response.txt
                exit 1
              fi

              # Download kubectl
              # URL に `//` があると 404（GCS が NoSuchKey を返す）。実測: 247 バイトの
              # XML エラーが kubectl として保存され、後段で
              # "./kubectl: line 1: syntax error" という無関係なメッセージで落ちる。
              # -f を付けて HTTP エラーで即座に失敗させる（set -e が効く）。
              curl -sSfLO "https://dl.k8s.io/release/v1.28.3/bin/linux/amd64/kubectl"
              chmod +x kubectl
              
              echo "creating client scopes"
              keycloak_post "/admin/realms/cnoe/client-scopes" "/var/config/client-scope-groups-payload.json" "Client scope"
              
              echo "creating admin group"
              keycloak_post "/admin/realms/cnoe/groups" "/var/config/group-admin-payload.json" "Admin group"

              echo "creating base-user group"
              keycloak_post "/admin/realms/cnoe/groups" "/var/config/group-base-user-payload.json" "Base-user group"

              echo "adding group claim to tokens"
              CLIENT_SCOPE_GROUPS_ID=$(keycloak_get "/admin/realms/cnoe/client-scopes" '.[] | select(.name == "groups") | .id')
              
              keycloak_post "/admin/realms/cnoe/client-scopes/${CLIENT_SCOPE_GROUPS_ID}/protocol-mappers/models" \
                "/var/config/group-mapper-payload.json" "Protocol mapper"

              # Create users function
              create_user() {
                local user_num=$1
                local payload_file=$2
                
                echo "creating user${user_num}"
                jq --arg pwd "$USER1_PASSWORD" '.credentials[0].value = $pwd' ${payload_file} > user${user_num}-payload-with-password.json
                keycloak_post "/admin/realms/cnoe/users" "user${user_num}-payload-with-password.json" "User${user_num}"
              }
              
              create_user "1" "/var/config/user1-payload.json"
              create_user "2" "/var/config/user2-payload.json"

              USER1ID=$(keycloak_get "/admin/realms/cnoe/users?lastName=one" ".[0].id")
              USER2ID=$(keycloak_get "/admin/realms/cnoe/users?lastName=two" ".[0].id")

              echo "USER1 ID: ${USER1ID}"
              echo "USER2 ID: ${USER2ID}"
              
              # ctc-dxc: 既存 client の URL を Git の payload に合わせ直す。
              #
              # 【なぜ必要か】上の keycloak_post は **409 を「already exists, continuing...」で
              # 素通りさせる**ため、client が既にあると payload の変更が一切反映されない。
              # 公開入口を :8443 へ移した際、realm の redirectUris が旧 :443 のまま残り
              # 「Invalid parameter: redirect_uri」になる（この非冪等性は upstream から）。
              #
              # 【なぜ全置換 PUT にしないか】payload には `secret` が無い。confidential client
              # （backstage / argo-workflows）を payload そのままで PUT すると
              # **シークレットを失いうる**。失っても job は後段の get_client_secret で
              # 新しい値を拾ってしまうため、稼働中の Pod だけが古い値を持つ＝
              # 「CI は成功したのに SSO だけ黙って壊れる」状態になる。
              # そこで **現在の表現を取得し、URL 系のキーだけ上書きして PUT** する。
              sync_client_urls() {
                local client_name=$1
                local payload_file=$2
                local client_id_name=$3

                local cid
                cid=$(keycloak_get "/admin/realms/cnoe/clients" \
                  ".[] | select(.clientId == \"${client_id_name}\") | .id") || {
                  echo "warn: ${client_name} client not found; skip URL sync"
                  return 0
                }

                envsubst < ${payload_file} > /tmp/desired-urls.json
                curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/cnoe/clients/${cid}" > /tmp/current-client.json

                # URL 系のキーだけを現在の表現へ被せる（null は落とす）。
                jq -s '.[0] * (.[1]
                        | {rootUrl, baseUrl, adminUrl, redirectUris, webOrigins}
                        | with_entries(select(.value != null)))' \
                  /tmp/current-client.json /tmp/desired-urls.json > /tmp/merged-client.json

                HTTP_STATUS=$(curl -sS -w "%{http_code}" -o /tmp/response.txt \
                  -H "Content-Type: application/json" \
                  -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                  -X PUT --data @/tmp/merged-client.json \
                  ${KEYCLOAK_URL}/admin/realms/cnoe/clients/${cid})
                if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
                  echo "Error syncing ${client_name} client URLs: HTTP status $HTTP_STATUS"
                  cat /tmp/response.txt
                else
                  echo "${client_name} client URLs synced"
                fi
              }

              # Create client function
              create_client() {
                local client_name=$1
                local payload_file=$2
                local client_id_name=$3

                echo "creating ${client_name} client"
                keycloak_post "/admin/realms/cnoe/clients" "${payload_file}" "${client_name} client"
                # ctc-dxc: 新規なら POST 済み・既存なら 409 で素通りしているので、
                # どちらの場合も URL 系を Git の payload に揃え直す。
                sync_client_urls "${client_name}" "${payload_file}" "${client_id_name}"
              }
              
              create_client "ArgoCD" "/var/config/argocd-client-payload.json" "argocd"
              
              # Add client scope function
              add_client_scope() {
                local client_id_name=$1
                local client_name=$2
                
                CLIENT_ID=$(keycloak_get "/admin/realms/cnoe/clients" ".[] | select(.clientId == \"${client_id_name}\") | .id")
                CLIENT_SCOPE_GROUPS_ID=$(keycloak_get "/admin/realms/cnoe/client-scopes" '.[] | select(.name == "groups") | .id')
                keycloak_put "/admin/realms/cnoe/clients/${CLIENT_ID}/default-client-scopes/${CLIENT_SCOPE_GROUPS_ID}" "${client_name} client scope"
              }
              
              add_client_scope "argocd" "ArgoCD"
              
              create_client "Backstage" "/var/config/backstage-client-payload.json" "backstage"
              
              add_client_scope "backstage" "Backstage"
              
              # Get client secret function
              get_client_secret() {
                local client_id_name=$1
                local var_name=$2
                
                CLIENT_ID=$(keycloak_get "/admin/realms/cnoe/clients" ".[] | select(.clientId == \"${client_id_name}\") | .id")
                local secret=$(keycloak_get "/admin/realms/cnoe/clients/${CLIENT_ID}" ".secret")
                eval "${var_name}=${secret}"
              }
              
              get_client_secret "backstage" "BACKSTAGE_CLIENT_SECRET"
              
              create_client "Argo Workflows" "/var/config/argo-client-payload.json" "argo-workflows"
              
              add_client_scope "argo-workflows" "Argo Workflows"
              get_client_secret "argo-workflows" "ARGO_WORKFLOWS_CLIENT_SECRET"

              echo "Creating ArgoCD session token for backstage"
              ARGOCD_PASSWORD=$(./kubectl -n argocd get secret argocd-initial-admin-secret -o go-template='{{.data.password | base64decode }}')
              
              ARGOCD_SESSION_TOKEN=$(curl -k -sS http://argocd-server.argocd.svc.cluster.local:443/argocd/api/v1/session -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"${ARGOCD_PASSWORD}\"}" | jq -r .token)

              echo "Creating keycloak-clients secret"
              
              echo \
              "apiVersion: v1
              kind: Secret
              metadata:
                name: keycloak-clients
                namespace: keycloak
              type: Opaque
              stringData:
                ARGO_WORKFLOWS_CLIENT_SECRET: ${ARGO_WORKFLOWS_CLIENT_SECRET}
                ARGOCD_SESSION_TOKEN: ${ARGOCD_SESSION_TOKEN}
                BACKSTAGE_CLIENT_SECRET: ${BACKSTAGE_CLIENT_SECRET}
                ARGOCD_ADMIN_PASSWORD: ${ARGOCD_PASSWORD}
              " > /tmp/secret.yaml
              
              ./kubectl apply -f /tmp/secret.yaml
              echo "Configuration Done!!"
              

