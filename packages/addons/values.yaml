argocd:
  enabled: true
  chartName: argo-cd
  namespace: argocd
  releaseName: argocd
  defaultVersion: "8.0.14"
  chartRepository: "https://argoproj.github.io/argo-helm"
  valuesObject:
    cnoe_ref_impl: # Specific values for reference CNOE implementation to control extraObjects.
      auto_mode: '{{ if eq .metadata.labels.auto_mode "true" }}true{{ else }}false{{ end }}'
    global:
      domain: '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ else }}argocd.{{ .metadata.annotations.domain }}{{ end }}'
    server:
      ingress:
        annotations: 
          cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
          # ctc-dxc: 入口を Terraform 管理 ALB へ切り替えるため、DNS レコードの所有権を
          # external-dns から Terraform へ移す（要件 v2.3 / NET-04）。
          # external-dns は --policy=upsert-only --interval=2m で稼働しており、
          # このアノテーションが無いと **2 分で A レコードを旧 NLB へ upsert し直し、
          # mTLS が黙って迂回される**。値が "dns-controller" 以外なら external-dns は無視する。
          external-dns.alpha.kubernetes.io/controller: none
        path: '/{{ if eq .metadata.labels.path_routing "true" }}argocd{{ end }}'
    configs:
      cm:
        # ctc-dxc: NETSKOPE-WORKAROUND（暫定）。ArgoCD が OIDC の redirect_uri を組む土台。
        # 既定は global.domain 由来の `https://<domain>`（path 無し・port 無し）だが、
        # Keycloak 側に登録される redirect URI は `https://<domain>:8443/argocd/auth/callback`
        # （keycloak/manifests/external-secrets.yaml の ARGO_CD_URL 由来）なので明示的に揃える。
        # **port だけでなく `/argocd` も足している**点に注意（既定値のままでは path が欠け、
        # 登録 URI と一致しない。:8443 化とは独立した既存の不整合で、未検証のまま是正した）。
        url: 'https://{{ if eq .metadata.labels.path_routing "false" }}argocd.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/argocd{{ end }}'
        oidc.config: |
          name: Keycloak
          issuer: https://{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/keycloak{{ end }}/realms/cnoe
          clientID: argocd
          enablePKCEAuthentication: true
          requestedScopes:
            - openid
            - profile
            - email
            - groups
      params:
        'server.basehref': '/{{ if eq .metadata.labels.path_routing "true" }}argocd{{ end }}'
        'server.rootpath': '{{ if eq .metadata.labels.path_routing "true" }}argocd{{ end }}'
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane-bootstrap', 'control-plane']

aws-load-balancer-controller:
  enabled: true
  # enableAckPodIdentity: true
  namespace: kube-system
  defaultVersion: "1.13.2"
  chartRepository: "https://aws.github.io/eks-charts"
  valuesObject:
    serviceAccount:
      name:  "aws-load-balancer-controller"
    vpcId: '{{ .metadata.annotations.aws_vpc_id }}'
    clusterName: '{{ .metadata.labels.clusterName }}'
  ignoreDifferences:
    - kind: Secret
      name: aws-load-balancer-tls
      jsonPointers: [/data]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
  selector:
    matchExpressions:
      - key: auto_mode
        operator: In
        values: ['false']
      - key: environment
        operator: In
        values: ['control-plane']

ingress-nginx:
  enabled: true
  chartName: ingress-nginx
  namespace: ingress-nginx
  releaseName: ingress-nginx
  defaultVersion: "4.7.0"
  chartRepository: "https://kubernetes.github.io/ingress-nginx"
  # ctc-dxc: 入口の単一障害点（SPOF）を解消する。
  #
  # 【何が問題だったか・2026-08-31 実測】controller が 1 replica で node 10.32.92.138
  # （AZ 1c）だけに載っており、このノードが落ちると全 URL が 503 になる。同ノードは
  # argocd-server も抱えているため、落ちると「入口」と「調査する道具」を同時に失う。
  #
  # 【なぜ PDB を別に書かないか】chart は replicaCount > 1 のときだけ PDB を生成する
  # （templates/controller-poddisruptionbudget.yaml）。よって 2 に上げると PDB も付いてくる。
  # ただし minAvailable は「効く値かどうか」が可用性を決めるので既定値任せにせず明示する
  # （実測: 既存の keycloak の PDB は maxUnavailable=1 で replica が 1 のため
  #  disruptionsAllowed=1 ＝ 唯一の pod を落とせる＝実質ノーガードだった）。
  #
  # 【なぜ hostname は required で zone は preferred か】SPOF 解消の本体は「同一ノードに
  # 載せない」ことなので hostname は required。zone まで required にすると AZ 障害時に
  # 生存 AZ へ 2 本目を置けず縮退できなくなるため、そちらは preferred にする。
  #
  # 【注意】ラベルは実クラスタの pod から採取した実測値（推測ではない）。selector が空振り
  # すると anti-affinity は無言で無効になり、2 本が同一ノードに載っても気づけない。
  valuesObject:
    controller:
      replicaCount: 2
      # PDB: 常に 1 本は残す（2 replica なので disruptionsAllowed=1 が実効的になる）
      minAvailable: 1
      affinity:
        podAntiAffinity:
          # 必須: 2 本を同一ノードに載せない
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: app.kubernetes.io/name, operator: In, values: ["ingress-nginx"] }
                  - { key: app.kubernetes.io/instance, operator: In, values: ["ingress-nginx"] }
                  - { key: app.kubernetes.io/component, operator: In, values: ["controller"] }
              topologyKey: kubernetes.io/hostname
          # 推奨: 2 AZ へ分散させる（満たせなくてもスケジュールは止めない）
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - { key: app.kubernetes.io/name, operator: In, values: ["ingress-nginx"] }
                    - { key: app.kubernetes.io/instance, operator: In, values: ["ingress-nginx"] }
                    - { key: app.kubernetes.io/component, operator: In, values: ["controller"] }
                topologyKey: topology.kubernetes.io/zone
  # ctc-dxc: TargetGroupBinding（Terraform 管理 ALB のターゲット登録）を配るために
  # manifests ディレクトリを追加ソースにする。要件 v2.3 / NET-04。
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

external-dns:
  enabled: true
  releaseName: external-dns
  namespace: external-dns
  chartName: external-dns
  chartRepository: https://kubernetes-sigs.github.io/external-dns
  defaultVersion: "1.16.1"
  valuesObject:
    zoneIdFilters:
      - '{{ .metadata.annotations.route53_hosted_zone_id }}'
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

external-secrets:
  enabled: true
  enableAckPodIdentity: false
  namespace: external-secrets
  chartName: external-secrets
  defaultVersion: "0.17.0"
  chartRepository: "https://charts.external-secrets.io"
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane-bootstrap', 'control-plane']

cert-manager:
  enabled: true
  chartName: cert-manager
  namespace: cert-manager
  releaseName: cert-manager
  defaultVersion: "1.17.2"
  chartRepository: "https://charts.jetstack.io"
  valuesObject:
    global:
      domainName: '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ end }}'
      pathRouting: '{{ if eq .metadata.labels.path_routing "true" }}true{{ else }}false{{ end }}'
      # DNS-01（Route53）solver 用。external-dns と同じ annotation 経由で受け取る。
      route53HostedZoneId: '{{ .metadata.annotations.route53_hosted_zone_id }}'
      awsRegion: '{{ .metadata.annotations.aws_region }}'
    # DNS-01 の伝播チェックを再帰リゾルバ経由にする。
    #
    # 理由: 既定では cert-manager が**権威ネームサーバへ直接** port 53 を叩くが、
    # 当環境のノード SG は DNS egress を VPC 内（10.32.0.0/16）に限定しているため
    # 外部権威 NS へ到達できず `dial tcp 205.251.195.199:53: i/o timeout` で
    # 伝播チェックが永久に失敗する（実測）。TXT レコード自体は Route53 に
    # 正しく作成されているので権限の問題ではない。
    #
    # egress を 0.0.0.0/0 へ開けるのではなく、クラスタ DNS（CoreDNS・EKS 既定の
    # サービス IP）を再帰リゾルバとして使う。CoreDNS は VPC リゾルバへ forward するので
    # 公開ゾーンの TXT を解決できる。ハードニング（DNS egress の VPC 限定）は維持する。
    # 注: CoreDNS の cache は 30 秒なので伝播確認が最大 30 秒遅れる（許容）。
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=172.20.0.10:53
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
        
keycloak:
  enabled: true
  chartName: keycloak
  namespace: keycloak
  releaseName: keycloak
  defaultVersion: "24.7.3"
  chartRepository: "https://charts.bitnami.com/bitnami"
  valuesObject:
    # Bitnami が 2025-08 に docker.io/bitnami/* の公開配布を終了したため、
    # chart が pin する docker.io/bitnami/keycloak:26.2.5-debian-12-r1 は 404 になる（実測）。
    # 既存タグは bitnamilegacy/* にアーカイブされているのでそちらを指す。
    # allowInsecureImages は chart 側の「公式イメージ以外を弾く」検査を解除するために必須
    # （既定 false のままだと repository を差し替えても chart が起動を拒否する）。
    # 恒久対応は公式 quay.io/keycloak/keycloak への移行だが、chart ごと変わるため別途検討する。
    global:
      security:
        allowInsecureImages: true
    image:
      repository: bitnamilegacy/keycloak
    postgresql:
      image:
        repository: bitnamilegacy/postgresql
    # ctc-dxc: NETSKOPE-WORKAROUND（暫定・要件 v2.3 / SEC-08）。
    # 【何を変えるか】Keycloak が発行する **frontend URL に :8443 を持たせる**。
    #
    # 【なぜ必要か・2026-08-23 の実測】SecurePC の Netskope は 80/443 の TLS を終端して
    # 張り直すため、ALB の mTLS にクライアント証明書が届かない。そこで入口を
    # :8443（Netskope が inspect しない）にしたが、Backstage のログインポップアップは
    # **discovery document の authorization_endpoint** へ飛ぶ。これは KEYCLOAK_HOSTNAME
    # 由来で port を持たないため :443 へ飛び、Netskope に落ちて ERR_CONNECTION_CLOSED に
    # なっていた（discovery を実測して確認）。
    #
    # 【なぜ backchannel は動的にしないか・2026-08-23 の実測】当初 `KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true`
    # を入れて「frontend は静的・backchannel は request 由来」に分けたが、**実測で壊れていた**:
    #
    #   token_endpoint  http://dev.codespire.ctcnative.com/keycloak/.../token   ← scheme が http
    #   jwks_uri        http://dev.codespire.ctcnative.com/keycloak/.../certs
    #
    # 動的解決は scheme も request から取る。この chart は `proxyHeaders: "forwarded"`＝
    # **RFC 7239 の `Forwarded` ヘッダ**を信頼する設定だが、ingress-nginx が送るのは
    # `X-Forwarded-*` なので Keycloak には信頼できるヘッダが届かず、TLS 終端後の生の
    # scheme（http）が採用される。サーバ側のトークン交換が平文 URL へ向かうため、
    # ingress-nginx の https リダイレクトに依存する脆い形になる（POST のリダイレクトは
    # 追随しないクライアントもある）。
    #
    # よって **全 URL を静的な :8443 に統一する**。クラスタ内から :8443 で到達できるよう
    # 80/443/8443 を持つ Service（ingress-nginx/manifests/service-public-ports.yaml）を置き、
    # split-horizon DNS の rewrite 先をそちらへ向けてある（cn-codespire 側 Terraform）。
    # scheme も port も 1 つに固定され、proxy ヘッダの解釈に依存しなくなる。
    #
    # 【上書きが効く理由】KEYCLOAK_HOSTNAME は chart が envFrom（ConfigMap keycloak-env-vars）で
    # 渡しており、extraEnvVars は explicit env になる。Kubernetes では explicit env が envFrom に
    # 勝つ（実機の env / envFrom の出所を確認済み）。
    #
    # 【撤去条件】Netskope が当ドメインを TLS inspection から除外したら、:8443 を落として
    # このブロックごと削除する。全箇所は `grep -rn NETSKOPE-WORKAROUND` で列挙できる。
    extraEnvVars:
    - name: KEYCLOAK_HOSTNAME
      value: 'https://{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}:8443/{{ if eq .metadata.labels.path_routing "true" }}keycloak/{{ end }}'
    httpRelativePath: '/{{ if eq .metadata.labels.path_routing "true" }}keycloak/{{ end }}'
    ingress:
      hostname: '{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}'
      annotations: 
        cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
        # ctc-dxc: 要件 v2.3 / NET-04。理由は argocd の同アノテーションのコメントを参照。
        # **4 つの Ingress すべてに付ける**必要がある（どれが TXT ownership の
        # owner になるかは external-dns の処理順で決まるため）。
        external-dns.alpha.kubernetes.io/controller: none
        # ctc-dxc: Keycloak の応答ヘッダが ingress-nginx の既定 proxy_buffer_size（4k）を
        # 超えて 502 になるのを防ぐ（2026-08-23 実測）。
        #
        # 【症状】SIGN IN を押すと `502 Bad Gateway`。nginx の error log は
        #   upstream sent too big header while reading response header from upstream
        #   request: "GET /keycloak/realms/cnoe/protocol/openid-connect/auth?..."
        # Keycloak 側は ready・restart 0 で、落ちてはいない。
        #
        # 【なぜ超えるのか】authorization endpoint の応答は `AUTH_SESSION_ID` /
        # `KC_STATE_CHECKER` に加えて **`KC_RESTART`（redirect_uri を含む JWT）** を
        # Set-Cookie で返す。redirect_uri が長いほどヘッダが膨らむ。
        # 公開入口を `:8443` にして全 URL が長くなったことで 4k を越えた
        # （それ以前は境界内に収まっていた＝21:51 の token 交換はここを通過している）。
        #
        # 【なぜ Ingress 単位か】controller の ConfigMap で全体を広げるより影響範囲が小さい。
        # Keycloak を ingress-nginx の背後に置く構成で広く知られた必要設定である。
        nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
      extraTls:
      - hosts:
        - '{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}'
        secretName: keycloak-server-tls
  # ArgoCD の phantom OutOfSync 対策（2026-08-20 実測）。
  # StatefulSet の spec.volumeClaimTemplates は API server が status（phase: Pending）と
  # volumeMode（Filesystem）を補完するが chart のレンダ結果には無いため、ArgoCD が差分と見なす。
  # 一方 volumeClaimTemplates は Kubernetes 側で immutable なので sync では絶対に解消できず
  # （`argocd app diff` は空・SSA dry-run apply は no-op ＝実ドリフトは無い）、
  # 無視しても検知能力を失わない（変更したいなら StatefulSet の作り直しが必要）。
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: keycloak-postgresql
      jsonPointers:
        - /spec/volumeClaimTemplates
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

backstage:
  enabled: true
  chartName: backstage
  namespace: backstage
  releaseName: backstage
  defaultVersion: "2.6.0"
  chartRepository: "https://backstage.github.io/charts"
  valuesObject:
    ingress:
      host: '{{ if eq .metadata.labels.path_routing "false" }}backstage.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}'
      annotations: 
        cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
        # ctc-dxc: 要件 v2.3 / NET-04。理由は argocd の同アノテーションのコメントを参照。
        external-dns.alpha.kubernetes.io/controller: none
    backstage:
      appConfig:
        catalog:
          locations:
            - type: url
              target: '{{ .metadata.annotations.addons_repo_url }}/blob/{{ .metadata.annotations.addons_repo_revision }}/templates/backstage/catalog-info.yaml'
      extraEnvVars:
      - name: BACKSTAGE_FRONTEND_URL
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}backstage.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443{{ end }}'
      - name: KEYCLOAK_NAME_METADATA
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/keycloak{{ end }}/realms/cnoe/.well-known/openid-configuration'
      # ctc-dxc: backstage backend は index.ts:76 の `if (process.env.KEYCLOAK_URL)` で
      # Keycloak provider の登録を判定する。値は使われず「存在するか」だけを見るフラグで、
      # metadataUrl は上の KEYCLOAK_NAME_METADATA 経由で app-config から読む。
      # 未設定だと provider が登録されず、ログイン画面が Guest のみになる（2026-09-02 実測）。
      - name: KEYCLOAK_URL
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/keycloak{{ end }}'
      - name: ARGO_WORKFLOWS_URL
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}argo-workflows.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/argo-workflows{{ end }}'
      - name: ARGO_CD_URL
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}argocd.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/argocd{{ end }}'
  # ArgoCD の phantom OutOfSync 対策（2026-08-20 実測）。
  # StatefulSet の spec.volumeClaimTemplates は API server が status（phase: Pending）と
  # volumeMode（Filesystem）を補完するが chart のレンダ結果には無いため、ArgoCD が差分と見なす。
  # 一方 volumeClaimTemplates は Kubernetes 側で immutable なので sync では絶対に解消できず
  # （`argocd app diff` は空・SSA dry-run apply は no-op ＝実ドリフトは無い）、
  # 無視しても検知能力を失わない（変更したいなら StatefulSet の作り直しが必要）。
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: backstage-postgresql
      jsonPointers:
        - /spec/volumeClaimTemplates
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

argo-workflows:
  enabled: true
  chartName: argo-workflows
  namespace: argo
  releaseName: argo-workflows
  defaultVersion: "0.45.18"
  chartRepository: "https://argoproj.github.io/argo-helm"
  valuesObject:
    server:
      baseHref: '/{{ if eq .metadata.labels.path_routing "true" }}argo-workflows/{{ end }}'
      sso:
        issuer: '{{ if eq .metadata.labels.path_routing "true" }}https://{{ .metadata.annotations.domain }}:8443/keycloak{{ else }}https://keycloak.{{ .metadata.annotations.domain }}{{ end }}/realms/cnoe'
        redirectUrl: '{{ if eq .metadata.labels.path_routing "true" }}https://{{ .metadata.annotations.domain }}:8443/argo-workflows{{ else }}https://argo-workflows.{{ .metadata.annotations.domain }}{{ end }}/oauth2/callback'
      ingress:
        annotations: 
          cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
          nginx.ingress.kubernetes.io/rewrite-target: '{{ if eq .metadata.labels.path_routing "true" }}/$2{{ end }}'
          # ctc-dxc: 要件 v2.3 / NET-04。理由は argocd の同アノテーションのコメントを参照。
          external-dns.alpha.kubernetes.io/controller: none
        hosts:
        - '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ else }}argo-workflows.{{ .metadata.annotations.domain }}{{ end }}'
        paths: 
        -  '/{{ if eq .metadata.labels.path_routing "true" }}argo-workflows(/|$)(.*){{ end }}'
        tls:
        - hosts:
          - '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ else }}argo-workflows.{{ .metadata.annotations.domain }}{{ end }}'
          secretName: argo-workflows-server-tls
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

# 2026-08-20: cluster には既に 3 つの ApplicationSet と配下の Application が存在し
# Synced/Healthy で稼働している。ここが false のままだと appset-pr は「git に無いもの」として
# prune を要求し続けるが、syncPolicy.automated に prune が無いため永久に OutOfSync になる
# （手動 sync でも PRUNE を明示しない限り解消しない）。crossplane は Backstage の
# app-with-bucket テンプレート（awsblueprints.io の ObjectStorage）が前提にするため残す判断。
# ctc-dxc: crossplane core を **再稼働**する（2026-08-31・根本原因の修正後の実測のため）。
#
# 【経緯】2026-08-19〜08-31 の 12 日間、EKS の監査ログ
# （`/aws/eks/dev-plat-codespire-eks/cluster`）が **21.2 GB/時 = 514 GB/日**を取り込み続け、
# 東京の $0.76/GB で **月額 約 $11,900** に達していた（4 ノード合計 約 $362 の 32 倍）。
# まず core を 0 replica にして出血を止め（PR #11）、次に原因を特定して直した（PR #12）。
# 本 PR はその修正が効いているかを**実測**するための再稼働である。
#
# 【原因（PR #12 で修正済み）】`packages/crossplane-aws-upbound/values.yaml` の
# DeploymentRuntimeConfig が **SA 名を 1 つに固定**し、chart がその DRC を
# providers（dynamodb / s3）**全員**に参照させていたため、複数の ProviderRevision が
# 同じ ServiceAccount の ownerReferences を奪い合い、収束しない reconcile ループになっていた。
# 上流ドキュメントが「よくある誤り」として警告している既知の罠で、少なくとも 7 件の
# 独立報告がある（crossplane/crossplane#7769〔OPEN・同一機構〕/ #7143 / #6152 / #5961 /
# #5458 / #5074 / #4552 / #3540）。**上流に code 修正は入っていない**ため、版を上げても直らない。
#
# 【計測の内訳】5 分間の Logs Insights 集計で
# `system:serviceaccount:crossplane-system:crossplane` の `update customresourcedefinitions` が
# **21,839 件（73.8 回/秒）**、1 イベント **79.57 KB**。73.8 × 79.57 KB = 352 MB/分 で、
# CloudWatch の IncomingBytes（約 340 MB/分）とほぼ一致する＝この 1 動作でほぼ全量を説明できる。
#
# 【この loop は「何も変えていない」】実測: CRD の `generation` は 1 のまま／32 CRD に対し
# `resourceVersion` の distinct は 32 件（＝1 CRD あたり 1 件で不変）／ProviderRevision の
# `resourceVersion` も 1,518 件の書き込みに対し 1 件のみ／`responseStatus.code` は毎回 200。
# つまり**書き込みは全部空振り**で、費用は EKS の監査ポリシーが CRD を
# `level: RequestResponse` で記録することから来ている（`providerrevisions` は `Metadata` で安価）。
# **loop 単体でも監査ログ単体でも問題にならず、両者が重なって初めて $11,900/月になる。**
#
# 【なぜ 12 日間気づかれなかったか】ArgoCD 15/15 Healthy・pod restart 0・cluster 全体 CPU
# 0.16 vCPU・Warning event 0・エラー 0（reconcile が success を返すので workqueue の
# rate limiter も backoff しない）。**この種の欠陥は健全性の指標では原理的に検知できず、
# 量・速度の指標だけが検知できる。** 当 account には CloudWatch alarm が 0 件・SNS topic 0 件・
# metrics-server 無し＝検知手段が存在しなかった。alarm の整備は別タスク。
#
# 【なぜ `enabled: false` にしないのか — それでは止まらない】
# 親 Application（`addons-appset-pr`）の syncPolicy は **`prune: false`** である。よって
# `enabled: false` にしても、レンダ結果から ApplicationSet が消えるだけで ArgoCD は
# **それを削除しない**（prune 無効）。結果 Application も workload も残り、**loop は止まらない**。
# 「設定を変えたのに何も起きない」典型なので、replica を明示する形を採る。
#
# 【再稼働時に確認すること（未検証）】「SA 競合がループの原因」は上流報告と同一クラスタ内の
# 対照（provider-family-aws は DRC を持たず revision 毎の SA を得ており、ループしていない）
# からの推定であり、**本クラスタでの実測はまだ無い**。再稼働後に次を確認する:
#   1. provider 毎の新しい SA（revision 名）が作られ、SA `provider-aws` の奪い合いが消えること
#   2. `IncomingBytes` が毎分ベースライン（約 1 MB/分）付近に留まること
#   3. 高止まりするなら **即 `replicas: 0` へ戻す**（1 分あたり約 $0.26 の露出）
# 安定を確認できたら、この `valuesObject` は削除して chart 既定（1）に戻してよい。
crossplane:
  enabled: true
  chartName: crossplane
  namespace: crossplane-system
  releaseName: crossplane
  defaultVersion: "1.20.0"
  chartRepository: "https://charts.crossplane.io/stable"
  valuesObject:
    # chart の top-level キー（v1.20.0 の values.yaml で確認済み。既定 1）。
    # PR #12 の SA pin 解除が効いているかを実測するため 1 へ戻す。
    # **高止まりしたら 0 に戻す**（判断材料は上の「再稼働時に確認すること」）。
    replicas: 1
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

crossplane-upbound-providers:
  enabled: true
  chartName: crossplane-aws-upbound
  namespace: crossplane-system
  releaseName: crossplane-upbound-providers
  defaultVersion: "3.0.0"
  chartRepository: "https://gitops-bridge-dev.github.io/gitops-bridge-helm-charts"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

crossplane-compositions:
  enabled: true
  namespace: crossplane-system
  type: manifest
  path: packages/crossplane-compositions
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

# ctc-dxc: GPU ノード（dev-plat-codespire-mng-gpu）で nvidia.com/gpu を割り当て可能にする。
#
# 【なぜ必要か】AL2023 の EKS 最適化 NVIDIA AMI は **ドライバは同梱するが device plugin は
# 含まない**（AWS 公式）。plugin が無いとノードの allocatable に nvidia.com/gpu が現れず、
# **ノードは Ready なのに GPU Pod だけ Pending** という分かりにくい壊れ方をする。
# Bottlerocket は同梱するため、AMI を替えるとこの Application は不要になる。
#
# 【最重要・既定 affinity を必ず上書きする】chart の既定 nodeAffinity は
# `feature.node.kubernetes.io/pci-10de.present` など **Node Feature Discovery が付ける
# ラベル**を required で要求する（v0.20.0 の values.yaml で実測）。本クラスタに NFD は
# **無い**ので、既定のまま入れると DaemonSet は作られるが **Pod が 1 つも起動しない**。
# それでも Application は Healthy になるため「入れたのに効かない」ことに気づけない。
# よってノードグループ側が付ける自前ラベル `node-role: gpu` へ差し替える
# （Helm はリスト値を**マージではなく置換**するので nodeSelectorTerms ごと入れ替わる）。
#
# 【tolerations】chart の既定にも nvidia.com/gpu:NoSchedule の toleration はあるが、
# GPU ノードグループ側の taint と対になる**必須要素**なので上流の既定変更に依存させず明示する
# （既定を書き換えると CriticalAddonsOnly は落ちるが、こちらは deprecated 扱い）。
#
# 【image tag を書かない理由】chart は appVersion をイメージタグに使う。defaultVersion で
# chart を固定してあるためタグは決定的になる。ここで `v` 接頭辞の有無を推測して書くと
# ImagePullBackOff になるだけで、固定の実効性は上がらない。
#
# 【namespace = kube-system の理由】device plugin は hostPath
# （/var/lib/kubelet/device-plugins）を要求するノード基盤コンポーネントで、PSA が
# baseline/restricted の namespace では弾かれる。kube-system は PSA 適用外で、
# 同じ理由で aws-load-balancer-controller も本ファイルで kube-system に置いている。
#
# 【desired_size = 0 の間は Pod ゼロが正常】GPU ノードが存在しないので DaemonSet の
# desired/current はどちらも 0 になる。異常ではない。
nvidia-device-plugin:
  enabled: true
  chartName: nvidia-device-plugin
  namespace: kube-system
  releaseName: nvidia-device-plugin
  defaultVersion: "0.20.0"
  chartRepository: "https://nvidia.github.io/k8s-device-plugin"
  valuesObject:
    # 既定（NFD 依存）を置換する。ここが空振りすると Pod が 0 のまま無言で終わる。
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role
                  operator: In
                  values: ["gpu"]
    # GPU ノードグループの taint（nvidia.com/gpu=true:NoSchedule）と対。
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

syncPolicy:
  automated:
    selfHeal: true
    allowEmpty: true
    prune: false

syncPolicyAppSet:
  preserveResourcesOnDeletion: false # Set to false so that cleanup script removes all the deployed resources