argocd:
  enabled: true
  chartName: argo-cd
  namespace: argocd
  releaseName: argocd
  defaultVersion: "8.0.14"
  chartRepository: "https://argoproj.github.io/argo-helm"
  valuesObject:
    cnoe_ref_impl: # Specific values for reference CNOE implementation to control extraObjects.
      auto_mode: '{{ if eq .metadata.labels.auto_mode "true" }}true{{ else }}false{{ end }}'
    global:
      domain: '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ else }}argocd.{{ .metadata.annotations.domain }}{{ end }}'
    server:
      ingress:
        annotations: 
          cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
          # ctc-dxc: 入口を Terraform 管理 ALB へ切り替えるため、DNS レコードの所有権を
          # external-dns から Terraform へ移す（要件 v2.3 / NET-04）。
          # external-dns は --policy=upsert-only --interval=2m で稼働しており、
          # このアノテーションが無いと **2 分で A レコードを旧 NLB へ upsert し直し、
          # mTLS が黙って迂回される**。値が "dns-controller" 以外なら external-dns は無視する。
          external-dns.alpha.kubernetes.io/controller: none
        path: '/{{ if eq .metadata.labels.path_routing "true" }}argocd{{ end }}'
    configs:
      cm:
        # ctc-dxc: NETSKOPE-WORKAROUND（暫定）。ArgoCD が OIDC の redirect_uri を組む土台。
        # 既定は global.domain 由来の `https://<domain>`（path 無し・port 無し）だが、
        # Keycloak 側に登録される redirect URI は `https://<domain>:8443/argocd/auth/callback`
        # （keycloak/manifests/external-secrets.yaml の ARGO_CD_URL 由来）なので明示的に揃える。
        # **port だけでなく `/argocd` も足している**点に注意（既定値のままでは path が欠け、
        # 登録 URI と一致しない。:8443 化とは独立した既存の不整合で、未検証のまま是正した）。
        url: 'https://{{ if eq .metadata.labels.path_routing "false" }}argocd.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/argocd{{ end }}'
        oidc.config: |
          name: Keycloak
          issuer: https://{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/keycloak{{ end }}/realms/cnoe
          clientID: argocd
          enablePKCEAuthentication: true
          requestedScopes:
            - openid
            - profile
            - email
            - groups
      params:
        'server.basehref': '/{{ if eq .metadata.labels.path_routing "true" }}argocd{{ end }}'
        'server.rootpath': '{{ if eq .metadata.labels.path_routing "true" }}argocd{{ end }}'
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane-bootstrap', 'control-plane']

aws-load-balancer-controller:
  enabled: true
  # enableAckPodIdentity: true
  namespace: kube-system
  defaultVersion: "1.13.2"
  chartRepository: "https://aws.github.io/eks-charts"
  valuesObject:
    serviceAccount:
      name:  "aws-load-balancer-controller"
    vpcId: '{{ .metadata.annotations.aws_vpc_id }}'
    clusterName: '{{ .metadata.labels.clusterName }}'
  ignoreDifferences:
    - kind: Secret
      name: aws-load-balancer-tls
      jsonPointers: [/data]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
  selector:
    matchExpressions:
      - key: auto_mode
        operator: In
        values: ['false']
      - key: environment
        operator: In
        values: ['control-plane']

ingress-nginx:
  enabled: true
  chartName: ingress-nginx
  namespace: ingress-nginx
  releaseName: ingress-nginx
  defaultVersion: "4.7.0"
  chartRepository: "https://kubernetes.github.io/ingress-nginx"
  # ctc-dxc: TargetGroupBinding（Terraform 管理 ALB のターゲット登録）を配るために
  # manifests ディレクトリを追加ソースにする。要件 v2.3 / NET-04。
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

external-dns:
  enabled: true
  releaseName: external-dns
  namespace: external-dns
  chartName: external-dns
  chartRepository: https://kubernetes-sigs.github.io/external-dns
  defaultVersion: "1.16.1"
  valuesObject:
    zoneIdFilters:
      - '{{ .metadata.annotations.route53_hosted_zone_id }}'
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

external-secrets:
  enabled: true
  enableAckPodIdentity: false
  namespace: external-secrets
  chartName: external-secrets
  defaultVersion: "0.17.0"
  chartRepository: "https://charts.external-secrets.io"
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane-bootstrap', 'control-plane']

cert-manager:
  enabled: true
  chartName: cert-manager
  namespace: cert-manager
  releaseName: cert-manager
  defaultVersion: "1.17.2"
  chartRepository: "https://charts.jetstack.io"
  valuesObject:
    global:
      domainName: '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ end }}'
      pathRouting: '{{ if eq .metadata.labels.path_routing "true" }}true{{ else }}false{{ end }}'
      # DNS-01（Route53）solver 用。external-dns と同じ annotation 経由で受け取る。
      route53HostedZoneId: '{{ .metadata.annotations.route53_hosted_zone_id }}'
      awsRegion: '{{ .metadata.annotations.aws_region }}'
    # DNS-01 の伝播チェックを再帰リゾルバ経由にする。
    #
    # 理由: 既定では cert-manager が**権威ネームサーバへ直接** port 53 を叩くが、
    # 当環境のノード SG は DNS egress を VPC 内（10.32.0.0/16）に限定しているため
    # 外部権威 NS へ到達できず `dial tcp 205.251.195.199:53: i/o timeout` で
    # 伝播チェックが永久に失敗する（実測）。TXT レコード自体は Route53 に
    # 正しく作成されているので権限の問題ではない。
    #
    # egress を 0.0.0.0/0 へ開けるのではなく、クラスタ DNS（CoreDNS・EKS 既定の
    # サービス IP）を再帰リゾルバとして使う。CoreDNS は VPC リゾルバへ forward するので
    # 公開ゾーンの TXT を解決できる。ハードニング（DNS egress の VPC 限定）は維持する。
    # 注: CoreDNS の cache は 30 秒なので伝播確認が最大 30 秒遅れる（許容）。
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=172.20.0.10:53
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
        
keycloak:
  enabled: true
  chartName: keycloak
  namespace: keycloak
  releaseName: keycloak
  defaultVersion: "24.7.3"
  chartRepository: "https://charts.bitnami.com/bitnami"
  valuesObject:
    # Bitnami が 2025-08 に docker.io/bitnami/* の公開配布を終了したため、
    # chart が pin する docker.io/bitnami/keycloak:26.2.5-debian-12-r1 は 404 になる（実測）。
    # 既存タグは bitnamilegacy/* にアーカイブされているのでそちらを指す。
    # allowInsecureImages は chart 側の「公式イメージ以外を弾く」検査を解除するために必須
    # （既定 false のままだと repository を差し替えても chart が起動を拒否する）。
    # 恒久対応は公式 quay.io/keycloak/keycloak への移行だが、chart ごと変わるため別途検討する。
    global:
      security:
        allowInsecureImages: true
    image:
      repository: bitnamilegacy/keycloak
    postgresql:
      image:
        repository: bitnamilegacy/postgresql
    # ctc-dxc: NETSKOPE-WORKAROUND（暫定・要件 v2.3 / SEC-08）。
    # 【何を変えるか】Keycloak が発行する **frontend URL に :8443 を持たせる**。
    #
    # 【なぜ必要か・2026-08-23 の実測】SecurePC の Netskope は 80/443 の TLS を終端して
    # 張り直すため、ALB の mTLS にクライアント証明書が届かない。そこで入口を
    # :8443（Netskope が inspect しない）にしたが、Backstage のログインポップアップは
    # **discovery document の authorization_endpoint** へ飛ぶ。これは KEYCLOAK_HOSTNAME
    # 由来で port を持たないため :443 へ飛び、Netskope に落ちて ERR_CONNECTION_CLOSED に
    # なっていた（discovery を実測して確認）。
    #
    # 【なぜ backchannel-dynamic が要るか】hostname を :8443 の固定 URL にすると
    # token_endpoint 等も :8443 になり **クラスタ内から呼べなくなる**（split-horizon DNS で
    # ingress-nginx へ向くが Service は 80/443 しか持たない・chart 4.7.0 に extraPorts は無い）。
    # hostname-backchannel-dynamic=true は「frontend は静的・backchannel は request 由来」に
    # 分ける公式オプションで、docs の "Set to true if your application accesses Keycloak via a
    # private network" がまさにこの構成（upstream 実装 HostnameV2ProviderFactory.java で確認）。
    #
    # 【上書きが効く理由】KEYCLOAK_HOSTNAME は chart が envFrom（ConfigMap keycloak-env-vars）で
    # 渡しており、extraEnvVars は explicit env になる。Kubernetes では explicit env が envFrom に
    # 勝つ（実機の env / envFrom の出所を確認済み）。
    #
    # 【撤去条件】Netskope が当ドメインを TLS inspection から除外したら、:8443 を落として
    # このブロックごと削除する。全箇所は `grep -rn NETSKOPE-WORKAROUND` で列挙できる。
    extraEnvVars:
    - name: KEYCLOAK_HOSTNAME
      value: 'https://{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}:8443/{{ if eq .metadata.labels.path_routing "true" }}keycloak/{{ end }}'
    - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
      value: 'true'
    httpRelativePath: '/{{ if eq .metadata.labels.path_routing "true" }}keycloak/{{ end }}'
    ingress:
      hostname: '{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}'
      annotations: 
        cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
        # ctc-dxc: 要件 v2.3 / NET-04。理由は argocd の同アノテーションのコメントを参照。
        # **4 つの Ingress すべてに付ける**必要がある（どれが TXT ownership の
        # owner になるかは external-dns の処理順で決まるため）。
        external-dns.alpha.kubernetes.io/controller: none
      extraTls:
      - hosts:
        - '{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}'
        secretName: keycloak-server-tls
  # ArgoCD の phantom OutOfSync 対策（2026-08-20 実測）。
  # StatefulSet の spec.volumeClaimTemplates は API server が status（phase: Pending）と
  # volumeMode（Filesystem）を補完するが chart のレンダ結果には無いため、ArgoCD が差分と見なす。
  # 一方 volumeClaimTemplates は Kubernetes 側で immutable なので sync では絶対に解消できず
  # （`argocd app diff` は空・SSA dry-run apply は no-op ＝実ドリフトは無い）、
  # 無視しても検知能力を失わない（変更したいなら StatefulSet の作り直しが必要）。
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: keycloak-postgresql
      jsonPointers:
        - /spec/volumeClaimTemplates
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

backstage:
  enabled: true
  chartName: backstage
  namespace: backstage
  releaseName: backstage
  defaultVersion: "2.6.0"
  chartRepository: "https://backstage.github.io/charts"
  valuesObject:
    ingress:
      host: '{{ if eq .metadata.labels.path_routing "false" }}backstage.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}{{ end }}'
      annotations: 
        cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
        # ctc-dxc: 要件 v2.3 / NET-04。理由は argocd の同アノテーションのコメントを参照。
        external-dns.alpha.kubernetes.io/controller: none
    backstage:
      appConfig:
        catalog:
          locations:
            - type: url
              target: '{{ .metadata.annotations.addons_repo_url }}/blob/{{ .metadata.annotations.addons_repo_revision }}/templates/backstage/catalog-info.yaml'
      extraEnvVars:
      - name: BACKSTAGE_FRONTEND_URL
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}backstage.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443{{ end }}'
      - name: KEYCLOAK_NAME_METADATA
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}keycloak.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/keycloak{{ end }}/realms/cnoe/.well-known/openid-configuration'
      - name: ARGO_WORKFLOWS_URL
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}argo-workflows.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/argo-workflows{{ end }}'
      - name: ARGO_CD_URL
        value: 'https://{{ if eq .metadata.labels.path_routing "false" }}argocd.{{ .metadata.annotations.domain }}{{ else }}{{ .metadata.annotations.domain }}:8443/argocd{{ end }}'
  # ArgoCD の phantom OutOfSync 対策（2026-08-20 実測）。
  # StatefulSet の spec.volumeClaimTemplates は API server が status（phase: Pending）と
  # volumeMode（Filesystem）を補完するが chart のレンダ結果には無いため、ArgoCD が差分と見なす。
  # 一方 volumeClaimTemplates は Kubernetes 側で immutable なので sync では絶対に解消できず
  # （`argocd app diff` は空・SSA dry-run apply は no-op ＝実ドリフトは無い）、
  # 無視しても検知能力を失わない（変更したいなら StatefulSet の作り直しが必要）。
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: backstage-postgresql
      jsonPointers:
        - /spec/volumeClaimTemplates
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

argo-workflows:
  enabled: true
  chartName: argo-workflows
  namespace: argo
  releaseName: argo-workflows
  defaultVersion: "0.45.18"
  chartRepository: "https://argoproj.github.io/argo-helm"
  valuesObject:
    server:
      baseHref: '/{{ if eq .metadata.labels.path_routing "true" }}argo-workflows/{{ end }}'
      sso:
        issuer: '{{ if eq .metadata.labels.path_routing "true" }}https://{{ .metadata.annotations.domain }}:8443/keycloak{{ else }}https://keycloak.{{ .metadata.annotations.domain }}{{ end }}/realms/cnoe'
        redirectUrl: '{{ if eq .metadata.labels.path_routing "true" }}https://{{ .metadata.annotations.domain }}:8443/argo-workflows{{ else }}https://argo-workflows.{{ .metadata.annotations.domain }}{{ end }}/oauth2/callback'
      ingress:
        annotations: 
          cert-manager.io/cluster-issuer: '{{ if eq .metadata.labels.path_routing "false" }}letsencrypt-prod{{ end }}'
          nginx.ingress.kubernetes.io/rewrite-target: '{{ if eq .metadata.labels.path_routing "true" }}/$2{{ end }}'
          # ctc-dxc: 要件 v2.3 / NET-04。理由は argocd の同アノテーションのコメントを参照。
          external-dns.alpha.kubernetes.io/controller: none
        hosts:
        - '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ else }}argo-workflows.{{ .metadata.annotations.domain }}{{ end }}'
        paths: 
        -  '/{{ if eq .metadata.labels.path_routing "true" }}argo-workflows(/|$)(.*){{ end }}'
        tls:
        - hosts:
          - '{{ if eq .metadata.labels.path_routing "true" }}{{ .metadata.annotations.domain }}{{ else }}argo-workflows.{{ .metadata.annotations.domain }}{{ end }}'
          secretName: argo-workflows-server-tls
  additionalResources:
  - manifestPath: "manifests"
    type: "manifests"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

# 2026-08-20: cluster には既に 3 つの ApplicationSet と配下の Application が存在し
# Synced/Healthy で稼働している。ここが false のままだと appset-pr は「git に無いもの」として
# prune を要求し続けるが、syncPolicy.automated に prune が無いため永久に OutOfSync になる
# （手動 sync でも PRUNE を明示しない限り解消しない）。crossplane は Backstage の
# app-with-bucket テンプレート（awsblueprints.io の ObjectStorage）が前提にするため残す判断。
crossplane:
  enabled: true
  chartName: crossplane
  namespace: crossplane-system
  releaseName: crossplane
  defaultVersion: "1.20.0"
  chartRepository: "https://charts.crossplane.io/stable"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

crossplane-upbound-providers:
  enabled: true
  chartName: crossplane-aws-upbound
  namespace: crossplane-system
  releaseName: crossplane-upbound-providers
  defaultVersion: "3.0.0"
  chartRepository: "https://gitops-bridge-dev.github.io/gitops-bridge-helm-charts"
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

crossplane-compositions:
  enabled: true
  namespace: crossplane-system
  type: manifest
  path: packages/crossplane-compositions
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

syncPolicy:
  automated:
    selfHeal: true
    allowEmpty: true
    prune: false

syncPolicyAppSet:
  preserveResourcesOnDeletion: false # Set to false so that cleanup script removes all the deployed resources