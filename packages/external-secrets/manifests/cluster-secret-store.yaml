apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      # fork 固定: upstream は us-west-2 をハードコードしており config.yaml の region を見ない。
      # ここが合っていないと ESO は別リージョンを探し、secret が見つからない。
      region: ap-northeast-1