### Config for CNOE AWS Reference Implementation ###
# Source: "https://github.com/cnoe-io/reference-implementation-aws"
# 環境: codespire dev（EKS: dev-plat-codespire-eks / ap-northeast-1）

# Details of your repository fork
repo:
  url: "https://github.com/ctc-dxc/reference-implementation-aws" # ctc-dxc org 内の fork
  revision: "HEAD" # Argo CD Apps が参照するブランチ／タグ
  basepath: "packages" # addon 構成の格納ディレクトリ

# 対象 EKS クラスタ名（terraform で構築済み）
cluster_name: "dev-plat-codespire-eks"

# Auto Mode ではなく Managed Node Group 構成のため "false"
# !!! 文字列であること（Argo CD cluster secret の label に渡されるため）
auto_mode: "false"

# EKS クラスタと config secret のリージョン
region: "ap-northeast-1"

# 公開に使うベースドメイン（Route53 hosted zone の委任済みサブドメイン）
domain: "dev.codespire.ctcnative.com"

# external-dns が使う Route53 hosted zone ID（dev.codespire.ctcnative.com のゾーン）
route53_hosted_zone_id: "Z02132212B7VGL21X9EZB"

# path routing: https://<domain>/<addon-name> でアクセスする
# !!! 文字列であること（同上）
path_routing: "true"

# AWS リソース用タグ
tags:
  githubRepo: "github.com/ctc-dxc/reference-implementation-aws"
  env: "dev"
  project: "codespire"
