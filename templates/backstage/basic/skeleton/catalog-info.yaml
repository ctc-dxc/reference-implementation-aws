---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.name | dump}}
  description: This is a basic example application
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: 'entity-id=${{values.name}}'
    backstage.io/kubernetes-namespace: default
    argocd/app-name: ${{values.name | dump}}
  links:
    # ctc-dxc: upstream は local Gitea を指していた。publish 先を GitHub へ変えたので追随する。
    # remoteUrl は publish の後でしか確定しないが、owner 固定＋repo 名＝name なので組み立てられる。
    - url: https://github.com/ctc-dxc/${{values.name}}
      title: Repo URL
      icon: github
spec:
  owner: guests
  lifecycle: experimental
  type: service
  system: ${{values.name | dump}}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{values.name | dump}}
  description: An example system for demonstration purposes
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/cnoe-io/stacks/tree/main/ref-implementation
      title: CNOE Repo 
      icon: github
spec:
  owner: guests
  lifecycle: experimental
  type: service
