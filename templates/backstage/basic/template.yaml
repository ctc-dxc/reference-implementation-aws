apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  description: Creates a Basic Kubernetes Deployment
  name: basic
  title: Create a Basic Deployment
spec:
  owner: guests
  type: service
  parameters:
    - title: Configuration Options
      required:
        - name
      properties:
        name:
          type: string
          description: name of this application
        
  steps:
    - id: template
      name: Generating component
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{parameters.name}}

    - id: publish
      name: Publishing to a GitHub repository
      action: publish:github
      # ctc-dxc 向けの読み替え（upstream は local kind 前提）:
      # upstream は Gitea（`cnoe.localtest.me:8443`＝127.0.0.1 に解決する local 専用ホスト）へ push する。
      # 本環境は **Gitea を導入しておらず**、Backstage の integrations も `github.com` の 1 件だけなので
      # そのままでは `No matching integration configuration for host cnoe.localtest.me:8443` で落ちる。
      # よって publish 先を GitHub App（`codespire-backstage-dev`・org ctc-dxc）に切り替える。
      # repoVisibility は private 固定（生成物が public org リポジトリとして露出しないようにする）。
      input:
        description: This is an example app
        repoUrl: github.com?owner=ctc-dxc&repo=${{parameters.name}}
        repoVisibility: private
        defaultBranch: main
        # ctc-dxc: GitHub App が作ったリポジトリには**作成者に権限が付かない**ため、
        # 人間側は org の base 権限（read のみ）しか持たず自分で削除できない。
        # ここで admin を明示的に付与する（org 設定 `members_can_delete_repositories` は true なので
        # repo の admin さえあれば削除できる）。
        #
        # 実装は `"user" in collaborator` で分岐するのでキーは `user`（`username` ではない）。
        # `@backstage/plugin-scaffolder-backend-module-github` 0.4.0 で確認。
        #
        # **チームを増やすときはここを team 指定へ変える**のが本筋:
        #   collaborators:
        #     - team: <team-slug>          # org に team を作りメンバーを入れる
        #       access: admin
        # そうすれば人が増えてもテンプレートを触らずに済む
        # （`members_can_create_teams` は true なので team は作れる）。
        # 現状は利用者が 1 名なので固定指定にしている。
        collaborators:
          - user: tranminhnat
            access: admin
    - id: create-argocd-app
      name: Create ArgoCD App
      action: cnoe:create-argocd-app
      input:
        appName: ${{parameters.name}}
        appNamespace: ${{parameters.name}}
        argoInstance: in-cluster
        projectName: default
        # necessary until we generate our own cert
        repoUrl: https://github.com/ctc-dxc/${{parameters.name}}
        path: "manifests"
    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        # 先頭スラッシュが必須。`catalog-info.yaml`（スラッシュ無し）だと repoContentsUrl との
        # 結合に失敗し、GitHub URL reader が **パスではなく ref クエリ**として解釈する:
        #   https://api.github.com/repos/<org>/<repo>/contents/?ref=catalog-info.yaml → 404
        # Gitea reader では露見しなかったため upstream はスラッシュ無しのまま残っていた
        # （GitHub 前提の app-with-bucket は元から '/catalog-info.yaml' になっている）。
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
